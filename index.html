<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarPlay Ultra</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/helvetica-neue-5" rel="stylesheet">
</head>

<body>
    <div class="speedometer">
        <svg class="gauge" viewBox="0 -25 210 300">
            <defs>
                <!-- Gradient untuk gauge progress -->
                <linearGradient id="gaugeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#081B17" />
                    <stop offset="100%" stop-color="#FFFFFFFF" />
                </linearGradient>
            </defs>

            <!-- Background arc -->
            <path class="gauge-bg" d="" stroke="#333" stroke-width="10" fill="none" />

            <!-- Progress arc pakai gradient -->
            <path class="gauge-progress" d="" stroke="url(#gaugeGradient)" stroke-width="10" fill="none" />

            <!-- Tick & number -->
            <g id="ticks"></g>
            <g id="outerTicks"></g>

            <!-- Health Gauge -->
            <circle class="health-bg" stroke="#444" stroke-width="6" fill="none" />
            <circle class="health-circle" stroke="limegreen" stroke-width="6" fill="none" stroke-linecap="round" />

            <!-- Fuel Gauge -->
            <path class="fuel-bg" />
            <path class="fuel-progress" />

        </svg>
        <div id="indicator" class="indicator">
            <img id="leftIndicator" src="asset/leftsignal-on.png"/>
            <img id="rightIndicator" src="asset/rightsignal-on.png"/>
        </div>

        <!-- Speed Text -->
        <div class="speed-text" id="speed">0</div>
        <div class="unit">km/h</div>
        <!-- icon fuel -->
        <svg class="icon-fuel" viewBox="0 0 46 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M11.7638 33.6221C11.7638 32.8057 12.4496 32.12 13.2659 32.12H14.2782V4.29909C14.2782 1.63781 15.7313 0.152071 18.4089 0.152071H31.0295C33.6908 0.152071 35.1765 1.62149 35.1765 4.29909V12.7564C37.9847 13.9156 39.1276 15.8911 39.1276 18.4381C39.1276 21.2137 38.7521 24.1525 38.7521 26.4383C38.7521 27.9077 39.6338 28.7893 41.0215 28.7893C42.6052 28.7893 43.4869 27.6465 43.4869 25.524C43.4869 22.5198 42.9971 18.6994 42.0665 14.4217L39.1113 11.2706C38.5235 10.6339 38.4582 10.1441 38.8174 9.47469L40.1072 7.09098C40.2215 6.87873 40.2215 6.65015 40.0909 6.48688L37.9031 3.74397C36.9888 2.6011 38.6541 1.36026 39.5031 2.43783L41.2175 4.57664C42.1644 5.73585 42.6542 7.05832 42.9808 8.64202L43.3073 10.1604C44.793 17.1157 45.5114 21.6382 45.5114 25.524C45.5114 28.92 43.8951 30.8302 41.0215 30.8302C38.3929 30.8302 36.7113 29.1322 36.7113 26.4383C36.7113 23.8423 37.0868 20.9035 37.0868 18.4381C37.0868 17.034 36.5317 15.8422 35.1765 15.0258V32.12H36.1725C37.0051 32.12 37.6909 32.8057 37.6909 33.6221C37.6909 34.4711 37.0051 35.1568 36.1725 35.1568H13.2659C12.4332 35.1568 11.7638 34.4711 11.7638 33.6221ZM19.0293 14.3238H30.4254C31.4867 14.3238 32.1724 13.7197 32.1724 12.7401V4.75624C32.1724 3.77663 31.503 3.15621 30.4254 3.15621H19.0293C17.9517 3.15621 17.2823 3.77663 17.2823 4.75624V12.7401C17.2823 13.7197 17.9517 14.3238 19.0293 14.3238ZM0.971813 16.7075L8.6291 12.1686C9.41279 11.7278 10.3597 12.1033 10.3597 12.9686V22.3239C10.3597 23.1892 9.42911 23.5811 8.6291 23.1239L0.971813 18.6014C0.220778 18.1606 0.253432 17.1483 0.971813 16.7075Z" />
        </svg>
    </div>

    <script src="script.js"></script>
</body>

</html>
